name: byob

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-byob}:${POSTGRES_PASSWORD:-byob}@postgres:5432/${POSTGRES_DB:-byob}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  MINIO_ENDPOINT_URL: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-byob}
  EMBEDDING_ENDPOINT_URL: http://embedding:7997
  RERANK_ENDPOINT_URL: http://rerank:7998
  MCP_SERVER_URL: http://mcp:8010/mcp
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  HF_HOME: /app/.cache/huggingface
  PYTHONUNBUFFERED: "1"

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16
    container_name: byob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-byob}
      POSTGRES_USER: ${POSTGRES_USER:-byob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-byob}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: byob-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: byob-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"healthz check passed\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: byob-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  embedding:
    image: ${INFINITY_IMAGE:-michaelf34/infinity:latest-cpu}
    container_name: byob-embedding
    restart: unless-stopped
    command:
      [
        "v2",
        "--model-id",
        "${EMBEDDING_MODEL:-BAAI/bge-m3}",
        "--engine",
        "torch",
        "--port",
        "7997",
      ]
    environment:
      HF_HOME: /app/.cache/huggingface
      DO_NOT_TRACK: "1"
    ports:
      - "${EMBEDDING_PORT:-7997}:7997"
    volumes:
      - embedding_cache:/app/.cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request; req=urllib.request.Request('http://localhost:7997/embeddings', data=json.dumps({'model':'${EMBEDDING_MODEL:-BAAI/bge-m3}','input':['health check']}).encode(), headers={'Content-Type':'application/json'}); urllib.request.urlopen(req, timeout=30).read()\"",
        ]
      interval: 30s
      timeout: 35s
      retries: 20
      start_period: 120s

  rerank:
    image: ${INFINITY_IMAGE:-michaelf34/infinity:latest-cpu}
    container_name: byob-rerank
    restart: unless-stopped
    command:
      [
        "v2",
        "--model-id",
        "${RERANK_MODEL:-BAAI/bge-reranker-base}",
        "--engine",
        "torch",
        "--port",
        "7998",
      ]
    environment:
      HF_HOME: /app/.cache/huggingface
      DO_NOT_TRACK: "1"
    ports:
      - "${RERANK_PORT:-7998}:7998"
    volumes:
      - rerank_cache:/app/.cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request; req=urllib.request.Request('http://localhost:7998/rerank', data=json.dumps({'model':'${RERANK_MODEL:-BAAI/bge-reranker-base}','query':'health','documents':['health check']}).encode(), headers={'Content-Type':'application/json'}); urllib.request.urlopen(req, timeout=30).read()\"",
        ]
      interval: 30s
      timeout: 35s
      retries: 20
      start_period: 120s

  api:
    build: *backend-build
    image: byob-backend:local
    container_name: byob-api
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn api.app.main:app --host 0.0.0.0 --port 8000",
      ]
    env_file:
      - .env
    environment:
      <<: *backend-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - backend_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding:
        condition: service_healthy
      rerank:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=10).read()\"",
        ]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s

  worker:
    image: byob-backend:local
    pull_policy: never
    container_name: byob-worker
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "workers.celery_app.celery_app",
        "worker",
        "-Q",
        "ingestion",
        "--loglevel",
        "${WORKER_LOG_LEVEL:-INFO}",
      ]
    env_file:
      - .env
    environment:
      <<: *backend-environment
    volumes:
      - backend_cache:/app/.cache
    depends_on:
      api:
        condition: service_healthy

  mcp:
    image: byob-backend:local
    pull_policy: never
    container_name: byob-mcp
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "api.app.mcp_server",
        "--transport",
        "streamable-http",
        "--host",
        "0.0.0.0",
        "--port",
        "8010",
      ]
    env_file:
      - .env
    environment:
      <<: *backend-environment
    ports:
      - "${MCP_PORT:-8010}:8010"
    volumes:
      - backend_cache:/app/.cache
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_MINIO_CONSOLE_URL: ${NEXT_PUBLIC_MINIO_CONSOLE_URL:-http://localhost:9001}
        NEXT_PUBLIC_QDRANT_DASHBOARD_URL: ${NEXT_PUBLIC_QDRANT_DASHBOARD_URL:-http://localhost:6333/dashboard}
    image: byob-frontend:local
    container_name: byob-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  embedding_cache:
  rerank_cache:
  backend_cache:
